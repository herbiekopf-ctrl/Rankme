name: Refresh Ranked data

on:
  schedule:
    - cron: "17 12 * * 0"
  workflow_dispatch:
    inputs:
      years:
        description: JSON array of seasons to refresh
        required: false
        default: "[2026]"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Ranked
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Import CFBD directly into Supabase
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REQUESTED_YEARS: ${{ inputs.years || '[2026]' }}
        run: npm run import:cfbd -- "$REQUESTED_YEARS"
